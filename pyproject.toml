[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgeml"
version = "0.1.0"
description = "Databricks-powered LLM fine-tuning, evaluation and optimization platform"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Krishna Kanojiya" }]
keywords = ["llm", "fine-tuning", "lora", "qlora", "mlflow", "databricks", "mlops"]
classifiers = [
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core dependencies stay LIGHT on purpose: the data layer, the selector, the
# evaluation math and the API contracts must import without torch installed.
# That keeps CI fast (no 2.5 GB CUDA wheel) and lets the FastAPI stub run
# anywhere. Heavy ML deps live in the optional extras below.
dependencies = [
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "pandas>=2.1",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
# Experiment tracking + registry. Needed on Databricks and locally.
tracking = [
  "mlflow>=2.16",
]
# Everything required to actually fine-tune. Installed on the GPU box only.
train = [
  "torch>=2.3",
  "transformers>=4.44",
  "datasets>=2.20",
  "accelerate>=0.33",
  "peft>=0.12",
  "trl>=0.9",
  "bitsandbytes>=0.43; platform_system != 'Darwin'",
  "sentencepiece>=0.2",
  "evaluate>=0.4",
  "rouge-score>=0.1.2",
]
# Serving layer.
api = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
]
# Public demo UI.
demo = [
  "gradio>=4.44",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "httpx>=0.27",
]
all = ["forgeml[tracking,train,api,demo,dev]"]

[project.scripts]
forgeml = "forgeml.cli:app"

[project.urls]
Homepage = "https://github.com/kkrishna-labs/forgeml"
Repository = "https://github.com/kkrishna-labs/forgeml"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forgeml = ["py.typed"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "api", "demo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
  "E501",   # line length handled by the formatter
  "B008",   # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "F401", "B018"]  # Databricks notebook idioms
"tests/*" = ["B011"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
markers = [
  "gpu: requires a CUDA GPU (skipped in CI)",
  "slow: takes more than a few seconds",
  "integration: touches Databricks / MLflow / network",
]

[tool.mypy]
python_version = "3.10"
packages = ["forgeml"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.coverage.run]
source = ["src/forgeml"]
omit = ["*/notebooks/*"]
