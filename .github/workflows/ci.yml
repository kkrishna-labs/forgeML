name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the previous run — no point burning
# minutes on a commit that is already superseded.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job installs into a project .venv and puts its bin directory on PATH,
# rather than targeting the runner's system interpreter. Ubuntu runners ship a
# PEP 668 "externally managed" Python, so a system install is refused outright —
# and a venv is what developers use locally anyway, so CI matches reality.
#
# `uv venv --clear` rather than `uv venv`: setup-uv already provisions a .venv
# when given a python-version, and a bare `uv venv` refuses to overwrite it.
# --clear makes the step idempotent regardless of what the action did first, so
# an action upgrade cannot break the install.
#
# No job installs torch. The decision layer (data, metrics, selector, API
# contracts) is deliberately torch-free so this whole workflow stays under a
# minute; pulling CUDA wheels would make it several.

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install
        run: |
          uv venv --clear
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install -e ".[tracking,api,dev]"

      - name: Ruff
        run: ruff check src tests api demo

      - name: Ruff format check
        run: ruff format --check src tests api demo

  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in pyproject; 3.12 is what runs locally.
        # Testing both catches syntax that only works on the newer one.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          uv venv --clear --python ${{ matrix.python-version }}
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install -e ".[tracking,api,dev]"

      - name: Verify the decision layer imports without torch
        run: |
          python - <<'PY'
          import importlib
          import sys

          for module in (
              "forgeml.config",
              "forgeml.data",
              "forgeml.evaluation.quality",
              "forgeml.optimization.selector",
              "forgeml.inference.predictor",
              "api.main",
          ):
              importlib.import_module(module)

          assert "torch" not in sys.modules, (
              "torch was imported by the decision layer — the CPU-only guarantee is broken"
          )
          print("decision layer is torch-free")
          PY

      - name: Test
        run: pytest --cov=forgeml --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install
        run: |
          uv venv --clear
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install -e ".[tracking,api,dev]"

      - name: Mypy
        run: mypy

  configs:
    name: configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install
        run: |
          uv venv --clear
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          uv pip install -e ".[dev]"

      - name: Every shipped config must validate
        run: |
          python - <<'PY'
          from pathlib import Path

          from forgeml.config import load_config

          for path in sorted(Path("configs").glob("*.yaml")):
              config = load_config(path)
              print(f"{path.name:<20} -> {config.run_slug()}")
          PY

  docker:
    name: docker build
    runs-on: ubuntu-latest
    # Only on main: the image build is the slowest job here and a PR does not
    # need it to know whether the code is correct.
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile
          push: false
          load: true
          tags: forgeml:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The container must answer /health in stub mode
        run: |
          docker run -d --name forgeml-ci -p 8000:8000 -e FORGEML_STUB=1 forgeml:ci
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "healthy after ${i}s"
              curl -s http://localhost:8000/health
              docker rm -f forgeml-ci
              exit 0
            fi
            sleep 1
          done
          echo "never became healthy; container logs:"
          docker logs forgeml-ci
          docker rm -f forgeml-ci
          exit 1
